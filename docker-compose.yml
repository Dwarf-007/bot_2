version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: dnd-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    ports:
      - "11434:11434"

  db:
    image: ankane/pgvector:latest
    container_name: dnd-db
    environment:
      POSTGRES_USER: dnd_master
      POSTGRES_PASSWORD: SzuperTitkosJelszo123
      POSTGRES_DB: dnd_campaign
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ollama_data:
  pgdata:
